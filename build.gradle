plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.1.0'
    id 'org.jetbrains.grammarkit' version '2022.3.2.1'
}

group = 'org.intellij.sdk'
version = '1.0.454'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

sourceSets {
    main.java.srcDirs 'src/main/gen'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        intellijIdeaCommunity('2024.3.4')
        bundledPlugin('com.intellij.java')
        // Note: execution and debugging modules are provided by module dependencies in plugin.xml
        pluginVerifier()
        zipSigner()
        instrumentationTools()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = false

    pluginConfiguration {
        version.set(project.version)
        ideaVersion {
            sinceBuild.set("233")
            untilBuild.set("251.*")
        }
    }

    pluginVerification {
        ides {
            recommended()
        }
    }

    // Configure sandbox to auto-open hbmiki-test project
    sandboxContainer = file("$buildDir/idea-sandbox")
    
    // Configure runIde to automatically open hbmiki-test project
    runIde {
        args = ["/home/developer/workspace/hbmiki-test"]
    }
}

// Configure main JAR only
jar {
    archiveBaseName = 'harbour-language-plugin'
    archiveVersion = project.version
}

// Configure tasks properly for the new plugin version
// Don't disable important tasks

// Task configuration
task createGenDir {
    doLast {
        def genDir = new File(projectDir, 'src/main/gen/org/intellij/sdk/language')
        genDir.mkdirs()
    }
}

generateLexer {
    sourceFile = file('src/main/grammar/Harbour.flex')
    targetDir = 'src/main/gen/org/intellij/sdk/language'
    targetClass = '_HarbourLexer'
    purgeOldFiles = true
    dependsOn createGenDir
}

tasks.compileJava.dependsOn tasks.generateLexer

// Configure trusted paths using proper PrepareSandboxTask approach
tasks.withType(org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask) {
    doLast {
        // Get project paths
        def projectPath = projectDir.absolutePath
        def parentDir = projectDir.parent ?: projectPath
        
        // Create trusted-paths.xml in sandbox config directory
        def sandboxConfigDir = new File(sandboxDirectory.get().asFile, "config")
        def trustedPathsFile = new File(sandboxConfigDir, "options/trusted-paths.xml")
        trustedPathsFile.parentFile.mkdirs()
        
        trustedPathsFile.text = """<application>
  <component name="Trusted.Paths">
    <option name="TRUSTED_PROJECT_PATHS">
      <map>
        <entry key="${parentDir}" value="true" />
        <entry key="${projectPath}" value="true" />
      </map>
    </option>
  </component>
</application>"""
        
        println "Configured trusted paths: ${parentDir}, ${projectPath}"
    }
}

// Task to ensure gradle directories exist
task ensureGradleDirs {
    doLast {
        // Create necessary gradle directories
        def gradleUserHome = gradle.gradleUserHomeDir
        def projectName = project.name ?: 'intellij-harbour'

        // Create daemon directory for current gradle version
        def gradleVersion = gradle.gradleVersion
        def daemonDir = new File(gradleUserHome, "daemon/${gradleVersion}/${projectName}")
        if (!daemonDir.exists()) {
            daemonDir.mkdirs()
            println "Created gradle daemon directory: ${daemonDir.absolutePath}"
        }

        // Also create a generic daemon directory as fallback
        def genericDaemonDir = new File(gradleUserHome, "daemon/${gradleVersion}")
        if (!genericDaemonDir.exists()) {
            genericDaemonDir.mkdirs()
        }
    }
}

// Ensure directories exist before running IDE
tasks.named('runIde') {
    dependsOn ensureGradleDirs
}

// Note: Trusted paths are now configured via PrepareSandboxTask hook above