plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.1.0'
    id 'org.jetbrains.grammarkit' version '2022.3.2.1'
    id 'com.github.breadmoirai.github-release' version '2.5.2'
}

group = 'org.intellij.sdk'
version = '1.2.49'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

sourceSets {
    main.java.srcDirs 'src/main/gen'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        intellijIdeaCommunity('2024.3.4')
        bundledPlugin('com.intellij.java')
        // Note: Database plugin not available in Community Edition
        // Will implement custom DBF viewing without database plugin dependency
        instrumentationTools()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = false

    pluginConfiguration {
        version.set(project.version)
        ideaVersion {
            sinceBuild.set("233")
            untilBuild.set("253.*")
        }
    }

    runIde {
        jvmArgs = ["-Xmx4096m"]
        args = [file("../hbmiki-test").absolutePath]
    }
}

// Configure main JAR only
jar {
    archiveBaseName = 'harbour-language-plugin'
    archiveVersion = project.version
}

// Configure tasks properly for the new plugin version
// Don't disable important tasks

// Task configuration
task createGenDir {
    doLast {
        def genDir = new File(projectDir, 'src/main/gen/org/intellij/sdk/language')
        genDir.mkdirs()
    }
}

generateLexer {
    sourceFile = file('src/main/grammar/Harbour.flex')
    targetDir = 'src/main/gen/org/intellij/sdk/language'
    targetClass = '_HarbourLexer'
    purgeOldFiles = true
    dependsOn createGenDir
}

tasks.compileJava.dependsOn tasks.generateLexer

// Configure trusted paths using proper PrepareSandboxTask approach
tasks.withType(org.jetbrains.intellij.platform.gradle.tasks.PrepareSandboxTask) {
    doLast {
        // Get project paths
        def projectPath = projectDir.absolutePath
        def parentDir = projectDir.parent ?: projectPath
        
        // Create trusted-paths.xml in sandbox config directory
        def sandboxConfigDir = new File(sandboxDirectory.get().asFile, "config")
        def trustedPathsFile = new File(sandboxConfigDir, "options/trusted-paths.xml")
        trustedPathsFile.parentFile.mkdirs()
        
        trustedPathsFile.text = """<application>
  <component name="Trusted.Paths">
    <option name="TRUSTED_PROJECT_PATHS">
      <map>
        <entry key="${parentDir}" value="true" />
        <entry key="${projectPath}" value="true" />
      </map>
    </option>
  </component>
</application>"""
        
        println "Configured trusted paths: ${parentDir}, ${projectPath}"
    }
}

// GitHub Release configuration
githubRelease {
    token = project.findProperty('github.token') ?: System.getenv('GITHUB_TOKEN') ?: ''
    owner = 'jo47011'
    repo = 'intellij-harbour'
    tagName = "v${project.version}"
    releaseName = "Harbour Language Plugin v${project.version}"
    generateReleaseNotes = true
    draft = true  // Create as draft first for safety
    prerelease = false
    
    // Upload the plugin zip file
    releaseAssets = fileTree(dir: 'build/distributions', include: "harbour-language-plugin-${project.version}.zip")
    
    // Optional: Add custom release body
    body = """
Harbour Language Plugin for IntelliJ IDEA ${project.version}

This release includes:
- Support for IntelliJ IDEA 2024.3.4
- Harbour language syntax highlighting
- Code completion
- Debugging support
- And more...

See the [README](https://github.com/jo47011/intellij-harbour/blob/main/README.md) for installation and usage instructions.
"""
}